name: MLOps platform regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql+psycopg://test:test-only@127.0.0.1:5432/wifiguard_test
      JWT_SECRET: ci-test-only-secret-not-for-deployment-32-bytes
      MQTT_HOST: ""
      KAFKA_BOOTSTRAP: ""
      TSDB_DSN: ""
      LOCAL_EDGE_TOKEN: ""
      MOBILE_PUSH_ENABLED: "0"
      SMTP_HOST: ""
    defaults:
      run:
        working-directory: WIFIGUARD-BACKEND
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest --junitxml=platform-tests.xml
      - run: uv run python tools/export_openapi.py --check
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WIFIGUARD-FRONTEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: WIFIGUARD-FRONTEND/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:cloud
  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WIFIGUARD-RASPBERRY
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra mqtt --extra dev
      - run: uv run pytest --junitxml=edge-tests.xml
