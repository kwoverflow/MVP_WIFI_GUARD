# Same-origin web gateway. No CORS widening, Docker socket, or host privilege.
services:
  frontend:
    build:
      context: ../../WIFIGUARD-FRONTEND
      dockerfile: Dockerfile.cloud
    environment:
      UI_HOST: 0.0.0.0
      UI_PORT: "4173"
    expose: ["4173"]
    restart: "on-failure:5"

  gateway:
    image: nginx:1.28-alpine
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-8080}:8080"
    volumes:
      - ../infra/nginx/ui.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    restart: "on-failure:5"
